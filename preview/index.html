<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A photograph and a quote</title>
<style>
  :root {
    --ground: #fdfdfb;
    --ink: #141414;
    --muted: #6f6f6a;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ground);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    min-height: 100svh;
    box-sizing: border-box;
    padding:
      max(64px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(84px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  main {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }
  .label {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 4px 14px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0 1px 12px;
  }
  .label a {
    color: inherit;
    text-decoration: none;
  }
  figure {
    margin: 0;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 48svh;
    object-fit: contain;
    object-position: left top;
  }
  .words blockquote {
    margin: 24px 0 0;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.25;
    max-width: 26ch;
  }
  .quote-credit {
    margin: 14px 0 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #again {
    position: fixed;
    top: max(2px, env(safe-area-inset-top));
    left: max(0px, env(safe-area-inset-left));
    margin: 0;
    padding: 16px;
    font-size: 15px;
    font-weight: 400;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: 0;
    appearance: none;
    -webkit-appearance: none;
    font-family: inherit;
    opacity: .38;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #again:focus-visible {
    outline: 1px solid var(--muted);
    outline-offset: -6px;
    opacity: .8;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    main {
      max-width: none;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 32px;
      align-items: center;
    }
    .label { grid-column: 1 / -1; }
    figure img {
      width: auto;
      max-width: 44vw;
      max-height: 68svh;
    }
    .words blockquote { margin-top: 0; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111110;
      --ink: #f2f2ee;
      --muted: #8f8f89;
    }
    .words blockquote { font-weight: 400; }
  }
</style>
</head>
<body>
<button id="again" type="button" aria-label="Show another photograph" title="">↻</button>
<main>
  <p class="label"><span id="who">Eugène Atget — Avenue des Gobelins</span><span id="when">1927</span></p>
  <figure>
    <img id="photo" alt="A Paris shop window displaying linen and an outfit on a headless mannequin, photographed by Eugène Atget in 1927">
  </figure>
  <div class="words">
    <blockquote id="q">All photographs are memento mori. To take a photograph is to participate in another person’s (or thing’s) mortality, vulnerability, mutability.</blockquote>
    <p class="quote-credit" id="qc">Susan Sontag · On Photography, 1977</p>
  </div>
</main>
<noscript><img src="photos/32bab31946b35c872b2b.webp" alt="A Paris shop window displaying linen and an outfit on a headless mannequin, photographed by Eugène Atget in 1927" style="max-width:100%;height:auto"></noscript>
<script>
  var PHOTOS = [{"img":"photos/32bab31946b35c872b2b.webp","alt":"A Paris shop window displaying linen and an outfit on a headless mannequin, photographed by Eugène Atget in 1927","who":"Eugène Atget — Avenue des Gobelins","when":"1927"},{"img":"photos/a6bf5a74ab072350c2fd.webp","alt":"A mother gazes into the distance, hand to her chin, while two children hide their faces against her shoulders, photographed by Dorothea Lange in Nipomo, California, 1936","who":"Dorothea Lange — Migrant Mother","when":"1936"},{"img":"photos/8104b2c3e51d88b00343.webp","alt":"The walled old city of Jerusalem seen from the Mount of Olives, olive groves in the foreground, photographed between 1898 and 1914","who":"American Colony Photo Dept — Jerusalem from the Mount of Olives","when":"1898–1914"},{"img":"photos/fc41d38897a25807df08.webp","alt":"The glass-roofed Passage du Pont-Neuf shopping arcade in Paris, photographed by Eugène Atget","who":"Eugène Atget — Passage du Pont-Neuf, Paris","when":"Musée Carnavalet"},{"img":"photos/721ac4ecf8e5f9cc9133.webp","alt":"Allie Mae Burroughs, wife of a cotton sharecropper, looking straight into the camera, photographed by Walker Evans in Hale County, Alabama, 1936","who":"Walker Evans — Allie Mae Burroughs, Hale County","when":"1936"},{"img":"photos/664a421d765c6e60aa35.webp","alt":"St. Catherine’s Monastery in the Sinai mountains, photographed by the American Colony Photo Department around 1900 to 1920","who":"American Colony Photo Dept — St. Catherine’s, Sinai","when":"ca. 1900–1920"},{"img":"photos/a313a7ddb335d0b1321e.webp","alt":"Tree-lined Allenby Street in Tel Aviv, photographed by the American Colony Photo Department between 1934 and 1939","who":"American Colony Photo Dept — Allenby Street, Tel Aviv","when":"1934–1939"},{"img":"photos/f6a386bf0f8dcc4001d6.webp","alt":"The Snake River winding beneath the Teton range, photographed by Ansel Adams in 1942","who":"Ansel Adams — The Tetons and the Snake River","when":"1942"},{"img":"photos/733dd3087c2b4e02fff4.webp","alt":"The White House cliff dwelling beneath a sandstone overhang in Canyon de Chelly, photographed by Timothy O’Sullivan in 1873","who":"Timothy O’Sullivan — White House Ruin, Canyon de Chelly","when":"1873"},{"img":"photos/5234bc7fd8eb066adcdc.webp","alt":"Aerial view of the Temple Mount and the Old City of Jerusalem, photographed by Andrew Shiva in 2013","who":"Andrew Shiva — Temple Mount from the Air, Jerusalem","when":"2013 · CC BY-SA 4.0","whoUrl":"https://commons.wikimedia.org/wiki/File:Jerusalem-2013(2)-Aerial-Temple_Mount-(south_exposure).jpg","whenUrl":"https://creativecommons.org/licenses/by-sa/4.0/"},{"img":"photos/8cf7d53c33883ba7bb94.webp","alt":"The Cosmic Cliffs of the Carina Nebula, imaged by the James Webb Space Telescope in 2022","who":"NASA · ESA · CSA · STScI — Cosmic Cliffs, Carina Nebula","when":"2022"}];
  var QUOTES = [
    { t: 'All photographs are memento mori. To take a photograph is to participate in another person\u2019s (or thing\u2019s) mortality, vulnerability, mutability.', c: 'Susan Sontag · On Photography, 1977' },
    { t: 'To collect photographs is to collect the world.', c: 'Susan Sontag · On Photography, 1977' },
    { t: 'The camera is an instrument that teaches people how to see without a camera.', c: 'Dorothea Lange · Los Angeles Times, 1978' },
    { t: 'Seeing comes before words.', c: 'John Berger · Ways of Seeing, 1972' },
    { t: 'The relation between what we see and what we know is never settled.', c: 'John Berger · Ways of Seeing, 1972' },
    { t: 'Not everything that is faced can be changed; but nothing can be changed until it is faced.', c: 'James Baldwin · The New York Times, 1962' },
    { t: 'The question is not what you look at, but what you see.', c: 'Henry David Thoreau · Journal, August 5, 1851' },
    { t: 'I believe a leaf of grass is no less than the journey-work of the stars.', c: 'Walt Whitman · Leaves of Grass, 1882' },
    { t: 'The stars awaken a certain reverence, because though always present, they are always inaccessible.', c: 'Ralph Waldo Emerson · Nature, 1836' }
  ];
  (function () {
    function pick(len, last) {
      var pool = [];
      for (var k = 0; k < len; k++) { if (k !== last) pool.push(k); }
      return pool[Math.floor(Math.random() * pool.length)];
    }
    var lastP = null, lastQ = null;
    try {
      lastP = localStorage.getItem('ef-p');
      lastQ = localStorage.getItem('ef-q');
    } catch (e) {}
    lastP = (lastP === null ? null : +lastP);
    lastQ = (lastQ === null ? null : +lastQ);
    var p = pick(PHOTOS.length, lastP);
    var q = pick(QUOTES.length, lastQ);
    var mp = location.search.match(/[?&]i=(\d+)/);
    var mq = location.search.match(/[?&]q=(\d+)/);
    var forced = false;
    if (mp && PHOTOS[+mp[1]]) { p = +mp[1]; forced = true; }
    if (mq && QUOTES[+mq[1]]) { q = +mq[1]; forced = true; }
    if (!forced) {
      try {
        localStorage.setItem('ef-p', String(p));
        localStorage.setItem('ef-q', String(q));
      } catch (e) {}
    }
    show(p, q);
    document.getElementById('again').addEventListener('click', function () {
      p = pick(PHOTOS.length, p);
      q = pick(QUOTES.length, q);
      try {
        localStorage.setItem('ef-p', String(p));
        localStorage.setItem('ef-q', String(q));
      } catch (e) {}
      show(p, q);
    });
  })();
  function setLabel(id, text, url) {
    var el = document.getElementById(id);
    el.textContent = '';
    if (url) {
      var a = document.createElement('a');
      a.href = url;
      a.textContent = text;
      el.appendChild(a);
    } else {
      el.textContent = text;
    }
  }
  function show(p, q) {
    var ph = PHOTOS[p];
    var img = document.getElementById('photo');
    img.src = ph.img;
    img.alt = ph.alt;
    setLabel('who', ph.who, ph.whoUrl);
    setLabel('when', ph.when, ph.whenUrl);
    document.getElementById('q').textContent = QUOTES[q].t;
    document.getElementById('qc').textContent = QUOTES[q].c;
    sizeQuote();
  }
  function sizeQuote() {
    var q = document.getElementById('q');
    var n = q.textContent.trim().length;
    q.style.fontSize = n <= 80 ? '29px' : (n <= 160 ? '26px' : '22px');
  }
</script>
</body>
</html>
