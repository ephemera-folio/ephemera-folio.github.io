<title>Avenue des Gobelins, 1927</title>
<style>
  :root {
    --ground: #fdfdfb;
    --ink: #141414;
    --muted: #6f6f6a;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ground);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    min-height: 100svh;
    box-sizing: border-box;
    padding:
      max(20px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(84px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  main {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }
  .label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0 1px 12px;
  }
  figure {
    margin: 0;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 48svh;
    object-fit: contain;
    object-position: left top;
  }
  blockquote {
    margin: 24px 0 0;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.25;
    max-width: 26ch;
  }
  .quote-credit {
    margin: 14px 0 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  @media (orientation: landscape) and (max-height: 500px) {
    main {
      max-width: none;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 32px;
      align-items: center;
    }
    .label { grid-column: 1 / -1; }
    figure img {
      width: auto;
      max-width: 44vw;
      max-height: 68svh;
    }
    blockquote { margin-top: 0; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111110;
      --ink: #f2f2ee;
      --muted: #8f8f89;
    }
    blockquote { font-weight: 400; }
  }
</style>
