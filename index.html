<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A photograph and a quote</title>
<style>
  :root {
    --ground: #fdfdfb;
    --ink: #141414;
    --muted: #6f6f6a;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ground);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    min-height: 100svh;
    box-sizing: border-box;
    padding:
      max(64px, env(safe-area-inset-top))
      max(20px, env(safe-area-inset-right))
      max(84px, env(safe-area-inset-bottom))
      max(20px, env(safe-area-inset-left));
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  main {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }
  .label {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 4px 14px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 0 1px 12px;
  }
  .label a {
    color: inherit;
    text-decoration: none;
  }
  figure {
    margin: 0;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 48svh;
    object-fit: contain;
    object-position: left top;
  }
  .words blockquote {
    margin: 24px 0 0;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.25;
    max-width: 26ch;
  }
  .quote-credit {
    margin: 14px 0 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #again {
    position: fixed;
    top: max(2px, env(safe-area-inset-top));
    left: max(0px, env(safe-area-inset-left));
    margin: 0;
    padding: 16px;
    font-size: 15px;
    font-weight: 400;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: 0;
    appearance: none;
    -webkit-appearance: none;
    font-family: inherit;
    opacity: .38;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #again:focus-visible {
    outline: 1px solid var(--muted);
    outline-offset: -6px;
    opacity: .8;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    main {
      max-width: none;
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 32px;
      align-items: center;
    }
    .label { grid-column: 1 / -1; }
    figure img {
      width: auto;
      max-width: 44vw;
      max-height: 68svh;
    }
    .words blockquote { margin-top: 0; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111110;
      --ink: #f2f2ee;
      --muted: #8f8f89;
    }
    .words blockquote { font-weight: 400; }
  }
</style>
</head>

    lastQ = (lastQ === null ? null : +lastQ);
    var p = pick(PHOTOS.length, lastP);
    var q = pick(QUOTES.length, lastQ);
    var mp = location.search.match(/[?&]i=(\d+)/);
    var mq = location.search.match(/[?&]q=(\d+)/);
    var forced = false;
    if (mp && PHOTOS[+mp[1]]) { p = +mp[1]; forced = true; }
    if (mq && QUOTES[+mq[1]]) { q = +mq[1]; forced = true; }
    if (!forced) {
      try {
        localStorage.setItem('ef-p', String(p));
        localStorage.setItem('ef-q', String(q));
      } catch (e) {}
    }
    if (p !== 0 || q !== 0) { show(p, q); } else { sizeQuote(); }
    document.getElementById('again').addEventListener('click', function () {
      p = pick(PHOTOS.length, p);
      q = pick(QUOTES.length, q);
      try {
        localStorage.setItem('ef-p', String(p));
        localStorage.setItem('ef-q', String(q));
      } catch (e) {}
      show(p, q);
    });
  })();
  function setLabel(id, text, url) {
    var el = document.getElementById(id);
    el.textContent = '';
    if (url) {
      var a = document.createElement('a');
      a.href = url;
      a.textContent = text;
      el.appendChild(a);
    } else {
      el.textContent = text;
    }
  }
  function show(p, q) {
    var ph = PHOTOS[p];
    var img = document.getElementById('photo');
    img.src = ph.img;
    img.alt = ph.alt;
    setLabel('who', ph.who, ph.whoUrl);
    setLabel('when', ph.when, ph.whenUrl);
    document.getElementById('q').textContent = QUOTES[q].t;
    document.getElementById('qc').textContent = QUOTES[q].c;
    sizeQuote();
  }
  function sizeQuote() {
    var q = document.getElementById('q');
    var n = q.textContent.trim().length;
    q.style.fontSize = n <= 80 ? '29px' : (n <= 160 ? '26px' : '22px');
  }
</script>
</body>
</html>
